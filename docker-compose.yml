services:
  hms:
    image: ${DOCKER_REGISTRY-}hms
    build:
      context: .
      dockerfile: HMS/Dockerfile
    container_name: hms-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=HMS;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      - JWT__Issuer=${JWT_ISSUER:-HMS-api}
      - JWT__Secret=${JWT_SECRET}
      - JWT__Audience=${JWT_AUDIENCE:-HMS-Client}
      - JWT__AccessTokenExpiryMinutes=${JWT_ACCESS_EXPIRY_MINUTES:-15}
      - JWT__RefreshTokenExpiryDays=${JWT_REFRESH_EXPIRY_DAYS:-7}
      - EmailSettings__Sender=${EMAIL_SENDER}
      - EmailSettings__SmtpServer=${EMAIL_SMTP_SERVER:-smtp.gmail.com}
      - EmailSettings__Port=${EMAIL_PORT:-465}
      - EmailSettings__UseSsl=${EMAIL_USE_SSL:-true}
      - EmailSettings__UserName=${EMAIL_USERNAME}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      - ClientUrls__ConfirmEmail=${CONFIRM_EMAIL_URL:-http://localhost:8080/api/auth/confirm-email}
    ports:
      - "8080:8080"
    networks:
      - hms-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hms-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hms-network

volumes:
  sqlserver-data:

networks:
  hms-network:
    driver: bridge
